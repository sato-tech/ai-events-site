<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AIイベント手帖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DM+Mono:wght@400;500&family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* 手帖+半券。日付ごとに束ね、イベントは切り取り線つきのカード。遊びは「気になる」を押した瞬間に全振り。 */
:root{
  --bg:#EEF1F8; --card:#FFFFFF; --sunk:#E0E5F2; --ink:#14182B; --ink2:#556080; --stroke:#14182B;
  --accent:#2447FF; --on-accent:#FFFFFF; --star:#FFB800;
  --ok:#0B7A4C; --soon:#9A5B00; --bad:#C8102E; --soon-bg:#FFE9A8; --bad-bg:#FFE1E6; --new:#FFD400;
  --f-display:'Dela Gothic One','Hiragino Sans','Yu Gothic',sans-serif;
  --f-body:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic',sans-serif;
  --f-mono:'DM Mono',ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1020; --card:#171A30; --sunk:#222640; --ink:#EEF0FA; --ink2:#9AA3C4; --stroke:#C9D0EE;
  --accent:#7C95FF; --on-accent:#0E1020; --star:#FFC933;
  --ok:#3DDC97; --soon:#FFC933; --bad:#FF6B81; --soon-bg:#4A3800; --bad-bg:#3E1520;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1020; --card:#171A30; --sunk:#222640; --ink:#EEF0FA; --ink2:#9AA3C4; --stroke:#C9D0EE;
  --accent:#7C95FF; --on-accent:#0E1020; --star:#FFC933;
  --ok:#3DDC97; --soon:#FFC933; --bad:#FF6B81; --soon-bg:#4A3800; --bad-bg:#3E1520;
  color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.7 var(--f-body);overflow-x:hidden}
h1,h2,h3,p{margin:0}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin-inline:auto;padding-inline:16px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 8px}
.brand{display:flex;align-items:center;gap:12px}
.brand svg{width:46px;height:52px;flex:none}
.brand h1{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,5vw,34px);line-height:1.1}
.brand h1 .mk{padding:0 .15em;background:linear-gradient(color-mix(in srgb,var(--accent) 38%,transparent),color-mix(in srgb,var(--accent) 38%,transparent)) no-repeat 0 78%/100% 46%;animation:mark .6s .35s ease-out backwards}
.meta{font-size:12px;color:var(--ink2);text-align:right}
.meta b{font-family:var(--f-mono);font-weight:500}

/* pico (mascot) */
.pico .body{fill:var(--card);stroke:var(--stroke);stroke-width:4;stroke-linejoin:round}
.pico .ac{fill:var(--accent);stroke:var(--stroke);stroke-width:3}
.pico .ln{stroke:var(--stroke);stroke-width:4;stroke-linecap:round;fill:none}
.pico .eye{fill:var(--ink);transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-block:14px 18px}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{border:2px solid var(--stroke);border-radius:16px;background:var(--card);padding:10px 14px;box-shadow:4px 4px 0 var(--stroke)}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(32px,6vw,46px);line-height:1.15;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;font-weight:700;color:var(--ink2)}
.stat.hot b{color:var(--accent)}

/* filters */
.bar{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row .lbl{font-size:12px;font-weight:900;color:var(--ink2);min-width:3.2em}
.chip{min-height:36px;padding:2px 14px;border:2px solid var(--stroke);border-radius:999px;background:var(--card);font-weight:700;font-size:13px;transition:transform .12s}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:900}
.search{flex:1 1 220px;min-width:0;min-height:40px;padding:4px 16px;border:2px solid var(--stroke);border-radius:999px;background:var(--card)}
select.chip{padding-right:10px}

/* day groups */
.day{margin-bottom:26px}
.day-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;position:sticky;top:0;z-index:2;padding-block:6px;background:linear-gradient(var(--bg) 78%,transparent)}
.day-h .d{font-family:var(--f-display);font-size:28px;line-height:1.1}
.day-h .w{font-weight:900;color:var(--ink2)}
.day-h .tag{font-size:12px;font-weight:900;padding:0 10px;border:2px solid var(--stroke);border-radius:999px;background:var(--accent);color:var(--on-accent)}
.day-h .n{margin-left:auto;font-size:12px;color:var(--ink2)}
.list{display:grid;gap:14px}

/* ticket card */
.ev{position:relative;display:grid;grid-template-columns:86px 1fr;border:2px solid var(--stroke);border-radius:16px;background:var(--card);box-shadow:4px 4px 0 var(--stroke);animation:fadeup .45s ease-out backwards;animation-delay:var(--d,0ms);min-width:0}
.ev.static{animation:none}
.ev .time{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 6px;border-right:2px dashed var(--stroke);position:relative;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.ev .time b{font-size:20px;font-weight:500;line-height:1.1}
.ev .time small{font-size:11px;color:var(--ink2)}
.ev .time::before,.ev .time::after{content:"";position:absolute;right:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:2px solid var(--stroke)}
.ev .time::before{top:-9px;clip-path:inset(50% 0 0 0)}
.ev .time::after{bottom:-9px;clip-path:inset(0 0 50% 0)}
.ev .main{padding:12px 14px 12px 18px;min-width:0}
.ev h3{font-size:16px;line-height:1.5;font-weight:900;overflow-wrap:anywhere}
.ev h3 a{text-decoration:none}
.ev h3 a:hover{text-decoration:underline;text-underline-offset:3px}
.org{font-size:12px;color:var(--ink2);margin-top:2px;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.c{display:inline-block;padding:0 9px;border:1.5px solid var(--stroke);border-radius:999px;font-size:12px;font-weight:700;background:var(--sunk);white-space:nowrap}
.c.on{background:var(--accent);color:var(--on-accent)}
.c.full{background:var(--bad-bg);color:var(--bad)}
.c.few{background:var(--soon-bg);color:var(--soon)}
.c.kw{background:transparent;color:var(--ink2);border-style:dashed}
.sticker{position:absolute;top:-10px;right:14px;transform:rotate(5deg);padding:0 12px;border:2px solid var(--stroke);border-radius:8px;background:var(--new);color:#14182B;font-weight:900;font-size:12px;box-shadow:2px 2px 0 var(--stroke);animation:slap .45s .25s cubic-bezier(.2,1.6,.4,1) backwards}
.sticker.up{background:var(--sunk);color:var(--ink);right:64px;transform:rotate(-4deg)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:2px 14px;border:2px solid var(--stroke);border-radius:999px;background:var(--card);font-weight:900;font-size:13px;text-decoration:none;transition:transform .12s}
.btn:active{transform:scale(.95)}
.btn.main{background:var(--accent);color:var(--on-accent)}
.star{display:inline-grid;place-items:center;width:40px;height:40px;border:2px solid var(--stroke);border-radius:50%;background:var(--card);transition:transform .12s}
.star:active{transform:scale(.88)}
.star svg{width:20px;height:20px;fill:none;stroke:var(--stroke);stroke-width:2.4;stroke-linejoin:round}
.star[aria-pressed="true"]{background:var(--star)}
.star[aria-pressed="true"] svg{fill:#14182B;stroke:#14182B}
.more{background:none;border:0;padding:4px 0;font-size:12px;font-weight:700;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;margin-left:auto}
.rows{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s ease}
.rows.open{grid-template-rows:1fr}
.rows>div{overflow:hidden;min-height:0}
.rows p{padding-top:10px;font-size:13px;color:var(--ink2);white-space:pre-line;overflow-wrap:anywhere}
@media(max-width:520px){.ev{grid-template-columns:1fr}.ev .time{flex-direction:row;gap:8px;border-right:0;border-bottom:2px dashed var(--stroke);padding:8px 14px;justify-content:flex-start}
  .ev .time::before,.ev .time::after{display:none}.ev .main{padding:12px 14px}}

/* empty */
.empty{display:grid;justify-items:center;gap:8px;text-align:center;padding:26px 16px 0;border:3px dashed var(--stroke);border-radius:22px;background:var(--card);overflow:hidden}
.empty h2{font-family:var(--f-display);font-weight:400;font-size:24px}
.empty p{color:var(--ink2);max-width:34em}
.empty code{font-family:var(--f-mono);background:var(--sunk);padding:1px 8px;border-radius:6px;font-size:13px}
.peek{width:120px;margin-top:10px;transform:translateY(6%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);animation:peek .8s .3s cubic-bezier(.2,.9,.3,1.2) backwards;cursor:pointer}
.peek:hover,.peek:focus-visible{transform:translateY(78%) rotate(-8deg)}

/* footer / toast / burst */
footer{padding-block:20px 60px;font-size:12px;color:var(--ink2);display:grid;gap:6px}
footer .src{display:flex;flex-wrap:wrap;gap:8px}
.s{padding:0 10px;border:1.5px solid var(--stroke);border-radius:999px;background:var(--card);font-weight:700}
.s.ok,.s.skipped{color:var(--ok)}.s.error{color:var(--bad);background:var(--bad-bg)}.s.unconfigured{color:var(--ink2);border-style:dashed}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:70;max-width:min(92vw,480px);padding:10px 18px;border:2px solid var(--stroke);border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px;box-shadow:4px 4px 0 var(--accent);transform:translate(-50%,160%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
.toast.on{transform:translate(-50%,0)}
.bst{position:fixed;z-index:80;pointer-events:none;width:14px;height:14px}

@keyframes fadeup{from{transform:translateY(14px);opacity:0}}
@keyframes mark{from{background-size:0% 46%}}
@keyframes slap{from{transform:scale(2.2) rotate(16deg);opacity:0}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes peek{from{transform:translateY(110%)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition-duration:.01ms!important}}
</style>
</head>

<div class="wrap">

  <section class="stats" aria-label="いまの状況">

  <section class="bar" id="bar" aria-label="絞り込み">

    <div class="row"><span class="lbl">出所</span><span class="row" id="f-src"></span></div>
    <div class="row">
      <input class="search" id="q" type="search" placeholder="タイトル・主催・内容で探す" aria-label="検索">
      <select class="chip" id="sort" aria-label="並び順">
        <option value="date">開催日順</option><option value="score">AI 度が高い順</option><option value="new">新着順</option>
      </select>
      <button class="chip" id="only-star" type="button" aria-pressed="false">気になるだけ</button>
    </div>
  </section>

  <main id="out" aria-live="polite"></main>
  <noscript><p>この画面は JavaScript で表示します。有効にしてから開き直してください。</p></noscript>

  <footer>
    <div class="src" id="srcs"></div>
    <p>日時はすべて日本時間。「AI 度」はタイトルと概要のキーワード一致から機械的に付けた目安です。取得し直すと一覧は更新されます。</p>
  </footer>
</div>

    h+='<span class="s '+esc(s.status)+'" title="'+esc(s.message||'')+'">'+esc(srcLabel(k))+': '+t+'</span>';
  });
  $('#srcs').innerHTML=h||'<span class="s unconfigured">取得元の情報なし</span>';
}

/* ---- 演出 ---- */
var toastT=null;
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on')},2600)}
function burst(x,y){
  if(reduce||!document.body.animate)return;
  for(var i=0;i<9;i++){
    var s=document.createElement('i');s.className='bst';s.style.left=(x-7)+'px';s.style.top=(y-7)+'px';
    s.style.background=(i%2?'var(--star)':'var(--accent)');s.style.clipPath='polygon(50% 0,62% 38%,100% 38%,69% 60%,81% 100%,50% 75%,19% 100%,31% 60%,0 38%,38% 38%)';
    document.body.appendChild(s);
    var a=i/9*Math.PI*2+Math.random()*.4,v=46+Math.random()*34;
    (function(el,dx,dy){el.animate([{transform:'translate(0,0) scale(.4) rotate(0)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) scale(1.15) rotate(160deg)',opacity:1,offset:.6},{transform:'translate('+dx*1.2+'px,'+(dy+16)+'px) scale(.2) rotate(240deg)',opacity:0}],{duration:620+Math.random()*180,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=function(){el.remove()}})(s,Math.cos(a)*v,Math.sin(a)*v);
  }
}

/* ---- イベント ---- */
document.addEventListener('click',function(ev){
  var t=ev.target.closest?ev.target:ev.target.parentElement,el;if(!t)return;
  if((el=t.closest('[data-f]'))){F[el.getAttribute('data-f')]=el.getAttribute('data-v');lsSet(LS_F,F);renderFilters();render();return}
  if((el=t.closest('[data-star]'))){
    var k=el.getAttribute('data-star'),on=!stars.has(k);
    if(on){stars.add(k);var r=el.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2);toast('気になるに入れました('+stars.size+' 件)')}else{stars.delete(k)}
    lsSet(LS_S,Array.from(stars));el.setAttribute('aria-pressed',on);renderStats();
    if(F.star&&!on)render();return;
  }
  if((el=t.closest('[data-more]'))){var rw=el.closest('.main').querySelector('.rows'),o=!rw.classList.contains('open');rw.classList.toggle('open',o);el.setAttribute('aria-expanded',o);el.textContent=o?'たたむ':'内容を見る';return}
  if(t.closest('[data-reset]')){F={range:'all',mode:'all',src:'all',q:'',sort:'date',star:false};lsSet(LS_F,F);renderFilters();render();return}
  if(t.closest('#only-star')){F.star=!F.star;lsSet(LS_F,F);renderFilters();render()}
});
$('#q').addEventListener('input',function(){F.q=this.value;lsSet(LS_F,F);render()});
$('#sort').addEventListener('change',function(){F.sort=this.value;lsSet(LS_F,F);render()});

renderMeta();renderFilters();render();renderStats();counted=true;
window.__aiEvents={jst:jst,gcal:gcal,safeUrl:safeUrl};
})();
</script>
